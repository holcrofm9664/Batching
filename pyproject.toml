[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slap"
version = "0.1.3"
description = "A package containing functions for optimising the storage location of products in a directional, single-block warehouse"
readme = "README.md"
requires-python = ">=3.10.12"
license = { text = "Apache 2.0" }
authors = [
    {name = "Mark Holcroft", email = "m.holcroft@lancaster.ac.uk"}
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=1.4.0",
    "gurobipy>=13.0.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache 2.0 License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "mypy",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_package = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88